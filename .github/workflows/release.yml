name: Release

# Builds the DMG and publishes a GitHub Release when a version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# By default the DMG is ad-hoc signed (users must right-click > Open once).
# For a Gatekeeper-clean, notarized DMG, add these repository secrets:
#
#   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12
#                         (base64 -i cert.p12 | pbcopy)
#   MACOS_CERT_PASSWORD   password of the .p12
#   SIGN_IDENTITY         e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID              Apple ID email for notarization
#   APPLE_TEAM_ID         10-character team ID
#   APPLE_APP_PASSWORD    app-specific password from account.apple.com

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # secrets.* cannot be referenced in step-level `if`, so expose presence
    # flags via job env instead.
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Set up notarization profile
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials claudelimit-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=claudelimit-notary" >> "$GITHUB_ENV"

      - name: Build DMG
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeLimit-*.dmg
          generate_release_notes: true
